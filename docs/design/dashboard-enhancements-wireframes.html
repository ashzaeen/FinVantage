<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinVantage Dashboard Wireframes</title>
<style>
:root{
  --surface:#f8f9fe; --card:#fff; --line:#dfe3f1; --ink:#16192c; --ink2:#4a4f68; --muted:#6b7288; --inset:#f4f5fa;
  --accent:#544af7; --accent-soft:#eef1fc; --in:#2a9d8f; --out:#dd6f2c; --warn:#dd8a1f; --blue:#2d83c9;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--surface:#0f1120;--card:#171a2e;--line:#2c3050;--ink:#eef0fa;--ink2:#b8bdd6;--muted:#8f96b3;--inset:#1d2138;--accent:#8f88ff;--accent-soft:#242850}
}
:root[data-theme="dark"]{--surface:#0f1120;--card:#171a2e;--line:#2c3050;--ink:#eef0fa;--ink2:#b8bdd6;--muted:#8f96b3;--inset:#1d2138;--accent:#8f88ff;--accent-soft:#242850}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font:15px/1.55 Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:Poppins,system-ui,sans-serif;margin:0;line-height:1.25}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 90px}
h1{font-size:clamp(26px,4vw,34px)}
.lead{color:var(--ink2);max-width:72ch;margin:8px 0 0}
.theme{float:right;border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:10px;padding:8px 12px;min-height:40px;font:600 12px Poppins,sans-serif;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:16px 0 4px;font-size:13px;color:var(--ink2)}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:6px}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-top:20px}
@media(min-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.wf{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.wf header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.wf .id{font:700 12px Poppins,sans-serif;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:2px 9px}
.wf h2{font-size:16px}
.wf .tab{margin-left:auto;font-size:12px;color:var(--muted)}
.frame{background:var(--inset);border-radius:14px;padding:8px}
.frame svg{display:block;width:100%;height:auto}
.wf ul{margin:0;padding-left:18px;color:var(--ink2);font-size:13.5px}
.wf li{margin:2px 0}
.mobile{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <button class="theme" id="tb" type="button">Toggle Theme</button>
  <h1>Dashboard Wireframes</h1>
  <p class="lead">Low-fidelity layouts for the components that need a new design. Numbers match the design plan. Figures are placeholders, not real data. Grey is structure, the colours are the real palette roles.</p>
  <div class="legend">
    <span><span class="sw" style="background:var(--accent)"></span>Magnitude, totals</span>
    <span><span class="sw" style="background:var(--in)"></span>Money in</span>
    <span><span class="sw" style="background:var(--out)"></span>Money out</span>
    <span><span class="sw" style="background:var(--warn)"></span>Needs a look (always with a word)</span>
    <span><span class="sw" style="background:var(--blue)"></span>Heads up</span>
  </div>
  <div class="grid" id="g"></div>
</div>
