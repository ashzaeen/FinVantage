# Checks every 30 minutes that the live API, both databases and the web app answer. A failed run
# emails whoever last changed the schedule below (GitHub's rule for scheduled workflows).
# GitHub may run it a few minutes late, and pauses schedules after 60 days without a push.
name: Health

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: API and databases
        run: |
          # Three tries, so a cold start on Vercel isn't reported as an outage.
          for attempt in 1 2 3; do
            code=$(curl --silent --max-time 30 --output body.json --write-out "%{http_code}" https://finvantage-api.vercel.app/health || echo 000)
            if [ "$code" = "200" ]; then cat body.json; exit 0; fi
            sleep 20
          done
          echo "::error::The API's /health answered $code: $(cat body.json 2>/dev/null)"
          exit 1

      - name: Web app
        run: curl --fail --silent --show-error --max-time 30 --output /dev/null https://finvantage-web-ten.vercel.app/
