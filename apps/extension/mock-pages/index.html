<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New tab</title>
    <style>
      :root { --bg: #f4f5f7; --tile: #ffffff; --ink: #1f2328; --muted: #6a7078; --line: #e3e5e9; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #1d1f22; --tile: #2a2d31; --ink: #eceef0; --muted: #a1a6ad; --line: #3a3d42; }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
        font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
        display: flex; flex-direction: column; align-items: center;
      }
      main { width: min(640px, calc(100% - 32px)); margin-top: 18vh; text-align: center; }
      .search {
        display: flex; align-items: center; gap: 12px; background: var(--tile); border: 1px solid var(--line);
        border-radius: 999px; padding: 13px 20px; color: var(--muted); box-shadow: 0 1px 6px rgb(0 0 0 / 0.06);
      }
      .search input { flex: 1; border: 0; background: none; font: inherit; color: var(--ink); outline: none; }
      .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 44px; }
      .tile { display: grid; justify-items: center; gap: 10px; padding: 16px 8px; border-radius: 14px; color: inherit; text-decoration: none; }
      .tile:hover { background: var(--tile); }
      .tile:focus-visible { outline: 2px solid #2563a8; outline-offset: 2px; }
      .icon { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--tile); border: 1px solid var(--line); }
      .tile span { font-size: 13px; }
      footer { margin-top: auto; padding: 24px; font-size: 12px; color: var(--muted); }
      footer a { color: inherit; }
      @media (max-width: 520px) { .tiles { grid-template-columns: repeat(2, 1fr); } main { margin-top: 10vh; } }
    </style>
  </head>
  <body>
    <main>
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m12.5 12.5 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input placeholder="Search or type a web address" aria-label="Search" />
      </label>

      <nav class="tiles" aria-label="Shortcuts">
        <a class="tile" href="/shop.html">
          <span class="icon"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="#3432c7"/><path d="M17.5 8.5A6 6 0 1 0 17.5 17.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg></span>
          <span>Circuit &amp; Co.</span>
        </a>
        <a class="tile" href="/rental.html">
          <span class="icon"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><path d="M3 12 13 4l10 8v10H3z" fill="none" stroke="#4f6b55" stroke-width="2" stroke-linejoin="round"/><path d="M13 21c-3-2-4-4-4-6 0-2 2-3 4-5 2 2 4 3 4 5 0 2-1 4-4 6z" fill="#7b2d26"/></svg></span>
          <span>Hearth Rentals</span>
        </a>
        <a class="tile" href="/car-quote.html">
          <span class="icon"><svg width="26" height="26" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="#121417"/><circle cx="14" cy="14" r="10" fill="none" stroke="#f2a93b" stroke-width="1.8"/><path d="M14 4v20M8 7c3.5 4.5 3.5 9.5 0 14M20 7c-3.5 4.5-3.5 9.5 0 14" fill="none" stroke="#f2a93b" stroke-width="1.4"/></svg></span>
          <span>Meridian Motors</span>
        </a>
        <a class="tile" href="/card-payment.html">
          <span class="icon"><svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="#0f2c4c"/><path d="M13 5l8 4.5v1.5H5V9.5z" fill="#fff"/><path d="M7.5 12.5v6M11 12.5v6M15 12.5v6M18.5 12.5v6" stroke="#fff" stroke-width="1.8"/><rect x="5" y="19.5" width="16" height="2" fill="#fff"/></svg></span>
          <span>Demo Bank</span>
        </a>
      </nav>
    </main>
    <footer>Test pages: <a href="/checkout-cad.html">price in CAD</a>, <a href="/rental-no-price.html">listing with no price</a></footer>
  </body>
</html>
